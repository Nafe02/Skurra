# Builds Skurra for Mac and Windows on GitHub's machines, for free, and
# publishes both downloads as a release.
#
# Run it by hand: GitHub -> Actions -> "Build and release" -> Run workflow.
# It reads VERSION from app.py and makes (or refreshes) release v<VERSION>.
#
# The downloads then live at fixed links that never change:
#   https://github.com/nafe02/Skurra/releases/latest/download/Skurra.dmg
#   https://github.com/nafe02/Skurra/releases/latest/download/Skurra.exe
#   https://github.com/nafe02/Skurra/releases/latest/download/Skurra-Windows.zip

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the build needs
        run: pip install pywebview pyinstaller send2trash certifi
      - name: Build the Windows folder, then a launcher that does not unpack Python into Temp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Fail($msg) {
            Write-Host "::error::$msg"
            throw $msg
          }
          $prefix = (python -c "import sys; print(sys.base_prefix)").Trim()
          $bins = @()
          foreach ($name in @("vcruntime140.dll", "vcruntime140_1.dll")) {
            $hit = @(
              (Join-Path $prefix $name),
              (Join-Path "$env:SystemRoot\System32" $name)
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hit) { Fail "Cannot ship Windows without $name" }
            Copy-Item $hit "windows-runtime-$name"
            $bins += @("--add-binary", "${hit};.")
          }
          # A folder, not one file. One file unpacks python312.dll into
          # Temp\_MEI... and Windows then reports that DLL could not be found.
          pyinstaller --noconfirm --windowed --noupx --name Skurra `
            --icon icon/Skurra.ico `
            --add-data "index.html;." `
            @bins `
            app.py
          # PyInstaller puts python312.dll in dist\Skurra\_internal, next to the
          # exe's private folder, not in Temp. Either place is fine.
          $py = Get-ChildItem -Path dist\Skurra -Recurse -Filter python312.dll | Select-Object -First 1
          if (-not $py) {
            $found = @(Get-ChildItem dist\Skurra -Recurse -Filter *.dll | ForEach-Object { $_.Name }) -join ', '
            Fail "python312.dll was not built into the Windows folder. Other DLLs: $found"
          }
          $bundle = $py.DirectoryName
          foreach ($name in @("vcruntime140.dll", "vcruntime140_1.dll")) {
            $destDll = Join-Path $bundle $name
            if (-not (Test-Path $destDll)) { Copy-Item "windows-runtime-$name" $destDll }
            if (-not (Test-Path $destDll)) { Fail "Windows folder is missing $name" }
          }
          if (Test-Path dist\Skurra-Windows.zip) { Remove-Item dist\Skurra-Windows.zip }
          Compress-Archive -Path dist\Skurra -DestinationPath dist\Skurra-Windows.zip
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { Fail "Windows launcher compiler was not at $csc" }
          $compile = & $csc /nologo /optimize /target:winexe `
            /win32icon:icon\Skurra.ico `
            /r:System.IO.Compression.dll `
            /r:System.IO.Compression.FileSystem.dll `
            /r:System.Windows.Forms.dll `
            /out:stub.exe windows\launchstub.cs 2>&1 | Out-String
          Write-Host $compile
          if ($LASTEXITCODE -ne 0) { Fail ($compile -replace '\s+', ' ') }
          $stub = [IO.File]::ReadAllBytes("stub.exe")
          $zip = [IO.File]::ReadAllBytes("dist\Skurra-Windows.zip")
          $out = [IO.File]::Create("dist\Skurra.exe")
          $out.Write($stub, 0, $stub.Length)
          $out.Write($zip, 0, $zip.Length)
          $out.Write([BitConverter]::GetBytes([int64]$stub.Length), 0, 8)
          $out.Close()
          $packed = [IO.File]::ReadAllBytes("dist\Skurra.exe")
          $at = [BitConverter]::ToInt64($packed, $packed.Length - 8)
          if ($packed[$at] -ne 0x50 -or $packed[$at + 1] -ne 0x4B) { Fail "Skurra.exe is not carrying the Windows folder" }
          Write-Host "Windows launcher is $($packed.Length) bytes and carries python312.dll beside the app."
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Skurra.exe
            dist/Skurra-Windows.zip

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the build needs
        run: pip install pywebview pyinstaller certifi
      - name: Build Skurra.app for Intel and Apple chips
        run: >
          pyinstaller --noconfirm --windowed --name Skurra
          --target-arch universal2
          --icon icon/Skurra.icns
          --osx-bundle-identifier com.skurra.app
          --add-data "index.html:."
          app.py
      - name: Wrap it in Skurra.dmg
        run: |
          # Say what we actually have before blaming hdiutil.
          ls -la dist || true
          df -h . | tail -1
          if [ ! -d dist/Skurra.app ]; then
            echo "::error::PyInstaller did not produce dist/Skurra.app"
            exit 1
          fi

          rm -rf dmg Skurra.dmg
          mkdir dmg
          cp -R dist/Skurra.app dmg/
          ln -s /Applications dmg/Applications

          # hdiutil on these runners fails now and then with a busy resource,
          # and -quiet used to hide the reason, so a failure said nothing at
          # all. Three goes, and always let it speak.
          for try in 1 2 3; do
            echo "--- hdiutil attempt $try ---"
            if hdiutil create -volname "Skurra" -srcfolder dmg -ov -format UDZO Skurra.dmg; then
              ls -la Skurra.dmg
              exit 0
            fi
            echo "hdiutil failed on attempt $try"
            hdiutil detach /Volumes/Skurra -force 2>/dev/null || true
            sleep 15
          done
          echo "::error::hdiutil could not build the disk image after three tries"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Skurra.dmg

  release:
    needs: [windows, mac]
    if: always() && (needs.windows.result == 'success' || needs.mac.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: needs.mac.result == 'success'
        with:
          name: mac
          path: out/mac
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: windows
          path: out/windows
      - name: Read the version number from app.py
        id: v
        run: echo "version=$(grep -m1 '^VERSION' app.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish release v${{ steps.v.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Skurra ${{ steps.v.outputs.version }}
          fail_on_unmatched_files: false
          body: |
            Mac: Skurra.dmg
            Windows: Skurra.exe. If a Python DLL error is still on screen, download Skurra-Windows.zip, extract it, open the Skurra folder, and run the Skurra.exe inside that folder.
          files: |
            out/mac/Skurra.dmg
            out/windows/Skurra.exe
            out/windows/Skurra-Windows.zip
      - name: Offer this version only after both downloads exist
        if: needs.windows.result == 'success' && needs.mac.result == 'success'
        continue-on-error: true
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          ver = Path("app.py").read_text().split('VERSION = "', 1)[1].split('"', 1)[0]
          path = Path("latest.json")
          data = json.loads(path.read_text())
          data["version"] = ver
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("latest.json", ver)
          PY
          git add latest.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Offer ${{ steps.v.outputs.version }} now that the Mac and Windows downloads exist."
          git push origin HEAD:main
